[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gebco-eez-refinement"
version = "0.1.0"
description = "Temporal refinement and ML-driven uncertainty assessment of GEBCO bathymetry in the Nigerian EEZ"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Desmond Dogiye" }]
keywords = ["bathymetry", "GEBCO", "machine-learning", "uncertainty", "Nigerian-EEZ", "oceanography"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Oceanography",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "xarray>=2023.1",
  "netCDF4>=1.6",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0", "rioxarray>=0.15"]
viz = ["cmocean>=3.0"]
dev = ["pytest>=7.4"]

[project.scripts]
gebco-eez-pipeline = "scripts.run_pipeline:main"

[tool.setuptools]
packages = ["src", "src.data", "src.features", "src.temporal", "src.models", "src.visualization"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
