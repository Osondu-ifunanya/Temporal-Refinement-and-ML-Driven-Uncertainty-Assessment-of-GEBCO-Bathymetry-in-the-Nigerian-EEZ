# Runtime configuration. Values here override the dataclass defaults in
# src/config.py. Delete a key to fall back to the default.

study_area:
  name: "Nigerian EEZ"
  # Rectangular envelope of the Nigerian EEZ (Gulf of Guinea), WGS84.
  lon_min: 2.0
  lon_max: 8.5
  lat_min: 1.0
  lat_max: 6.5

gebco:
  # Annual GEBCO gridded releases to compare for temporal refinement.
  versions: [2020, 2021, 2022, 2023, 2024]
  reference_version: 2024
  filename_template: "GEBCO_{year}.nc"
  depth_var: "elevation"
  lon_name: "lon"
  lat_name: "lat"

model:
  random_state: 42
  test_size: 0.2
  n_estimators: 400
  max_depth: null
  lower_quantile: 0.05
  upper_quantile: 0.95
  calibration_size: 0.2
  target: "depth"
  features:
    - lon
    - lat
    - slope
    - aspect_sin
    - aspect_cos
    - roughness
    - tpi
    - curvature
    - temporal_std
